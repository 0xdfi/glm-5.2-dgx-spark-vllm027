name: source-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.3
      - name: Bootstrap the hash-locked developer environment
        run: ./scripts/bootstrap_dev.sh
      - name: Run unit and contract tests
        run: |
          make test
          make contracts
          make lint-manifests
      - name: Verify REUSE and provenance
        run: |
          .venv/bin/reuse lint
          .venv/bin/python scripts/register_provenance.py --staged --check
          .venv/bin/python scripts/audit_licenses.py --strict
          .venv/bin/python scripts/audit_container_licenses.py --scope source
      - name: Scan reachable history and tracked source
        run: |
          ./scripts/scan_secrets.sh --mode source --root . --revision HEAD --report "$RUNNER_TEMP/source-secret-scan.json"
          .venv/bin/python scripts/scan_large_files.py --root . --revision HEAD --report "$RUNNER_TEMP/large-file-scan.json"
      - name: Check shell and documentation contracts
        run: |
          find scripts recipes -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          .venv/bin/python -m pytest tests/test_docs.py tests/test_workflows.py -q
          .venv/bin/python scripts/render_release_status.py --check
      - name: Verify exact public O14 import
        env:
          O14_COMMIT: 9ba54db8f7c852eabb90372f7dcf47f87eafbe20
        run: |
          git init -q "$RUNNER_TEMP/o14"
          git -C "$RUNNER_TEMP/o14" remote add origin https://github.com/0xdfi/GLM-5.2-Harness-O14-4x-DGX-Spark.git
          git -C "$RUNNER_TEMP/o14" fetch --depth=1 origin "$O14_COMMIT"
          git -C "$RUNNER_TEMP/o14" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/o14" rev-parse HEAD)" = "$O14_COMMIT"
          .venv/bin/python tools/import_runtime.py --root . --source "$RUNNER_TEMP/o14" --verify-only
      - name: Verify static source closure
        run: .venv/bin/python scripts/verify_source.py
